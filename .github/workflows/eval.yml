name: eval

# Manual only: every run uses Claude subscription quota (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`).
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per case
        default: "1"
      case:
        description: Case name glob (empty = all cases)
        default: ""
      max_cost_usd:
        description: Hard cost ceiling for the whole run
        default: "10"

jobs:
  plugin-eval:
    # macOS: on Linux runners the eval's Bash sandbox can't nest its user namespace, so the agent
    # never gets a shell and the scripts never run.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Bash-granting evals refuse to start while ~/.docker holds symlinks.
      - run: if [ -d ~/.docker ]; then mv ~/.docker ~/.docker.off; fi
      - run: npm install -g @anthropic-ai/claude-code
      # Scores are the output, so a case below 1.0 should not fail the job.
      - run: >
          claude plugin eval .
          --allow-tools Bash,Write,Edit
          --scaffold --trust-plugin --no-publish
          --runs "$RUNS" --max-cost-usd "$MAX_COST" --threshold 0 -j 4
          ${CASE:+--case "$CASE"}
          --json evals/results/ci.json
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RUNS: ${{ inputs.runs }}
          CASE: ${{ inputs.case }}
          MAX_COST: ${{ inputs.max_cost_usd }}
      # A run whose shell was blocked still gets graded, so fail loudly instead of reporting no-script scores.
      - run: >
          node -e 'const r=require("./evals/results/ci.json");
          const blocked=JSON.stringify(r).match(/apply-seccomp|nested userns|Bash-granting evaluation cannot run/g)||[];
          if(blocked.length){console.error(blocked.length+" sandbox errors in agent shells");process.exit(1)}'
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: evals/results/
